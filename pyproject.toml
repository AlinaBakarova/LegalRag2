[project]
name = "legal-workspace"
version = "0.1.0"
description = "Local, single-user workspace for document-based legal analysis"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "filelock>=3.16,<4",
    "nicegui>=3.0,<4",
    "pydantic-settings>=2.7,<3",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
legal-workspace = "legal_workspace.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "playwright>=1.50,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: real Chromium acceptance test (opt in with --browser)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
